<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <radialGradient id="bg" cx="18%" cy="8%" r="95%">
      <stop offset="0%" stop-color="#18224a"/>
      <stop offset="45%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#070a13"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="trust" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- soft accent glows -->
  <circle cx="1080" cy="60" r="130" fill="#7dd3fc" opacity="0.10" filter="url(#glow)"/>
  <circle cx="150" cy="260" r="160" fill="#a78bfa" opacity="0.10" filter="url(#glow)"/>

  <!-- logo mark -->
  <rect x="70" y="82" width="64" height="64" rx="18" fill="url(#mark)"/>
  <path d="M90 116l12.5 12.5L146 88" fill="none" stroke="#07111f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wordmark -->
  <text x="155" y="128" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#f5f7ff" letter-spacing="-0.5">AutoJob Intel</text>

  <!-- eyebrow -->
  <text x="70" y="185" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" letter-spacing="3" fill="#7dd3fc">OFFICIAL-LINK JOB INTELLIGENCE</text>

  <!-- headline -->
  <text x="68" y="230" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" letter-spacing="-1" fill="#f5f7ff">Job search built on <tspan fill="url(#trust)">trust</tspan>, not volume.</text>

  <!-- tag pills -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#dce5ff">
    <rect x="70" y="252" width="176" height="34" rx="17" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="90" y="274">Official career sites</text>

    <rect x="258" y="252" width="140" height="34" rx="17" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="278" y="274">Link re-checks</text>

    <rect x="410" y="252" width="176" height="34" rx="17" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="430" y="274">Cited requirements</text>
  </g>
</svg>
